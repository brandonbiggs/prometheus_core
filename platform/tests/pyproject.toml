[project]
name = "prometheus-infra-tests"
version = "0.1.0"
description = "Infrastructure tests for Prometheus Platform Docker services"
requires-python = "~=3.12.0"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    # Cross-repo A2A contract tests exercise the real prometheus_api request
    # parsing against the client-agent's and frontend's request builders.
    "prometheus-api",
]

[tool.uv.sources]
# The repo's sdk/, the same prometheus_api the platform's images are built from
prometheus-api = { path = "../../sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker containers running (deselect with '-m not integration')",
    "system: requires an already-running full platform with the client-agent port published",
]
testpaths = ["infrastructure"]

[dependency-groups]
dev = [
    "ruff>=0.16",
]
