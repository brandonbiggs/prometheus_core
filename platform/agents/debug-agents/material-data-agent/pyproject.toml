[project]
name = "data-agent"
version = "0.1.0"
description = "Material data retrieval agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
# Async tests do not need @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 50.0
precision = 2
