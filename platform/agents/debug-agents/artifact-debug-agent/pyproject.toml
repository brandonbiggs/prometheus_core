[project]
name = "artifact-debug-agent"
version = "0.1.0"
description = "Artifact creation and conversion debug agent"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4.0",
    "cairosvg>=2.7.1",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
# Async tests do not need @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 26.2
precision = 2
