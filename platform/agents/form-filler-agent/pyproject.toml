[project]
name = "form-filler-agent"
version = "0.1.0"
description = "Form completion agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.26.0",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
# Async tests do not need @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
# The lowest total across the supported Python versions; never lower it
fail_under = 30.9
precision = 2
